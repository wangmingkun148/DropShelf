# 推送 v 或 style 开头的标签（或在 Releases 页面用新标签发布）时，编译安装包和便携版并附加到对应的 Release。
# 也可以手动运行，给已有的 Release 补上文件。
name: Release

on:
  push:
    tags: ['v*', 'style*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要补上文件的 Release 标签
        required: true

permissions:
  contents: write

concurrency: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "${env:ProgramFiles}\Inno Setup*\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if (-not $iscc) { throw "未找到 Inno Setup 编译器。" }
          # Inno Setup 6 不自带简体中文界面文件。版本要和构建机上的 Inno Setup（目前是 6.7.1）一致，旧版本的文件缺少新增的提示，安装时会显示英文。
          $language = Join-Path $iscc.DirectoryName "Languages\ChineseSimplified.isl"
          if (-not (Test-Path -LiteralPath $language)) {
              Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_7_1/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile $language
          }
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV

      - name: 生成安装包和便携版
        shell: pwsh
        run: .\installer\Build-Installer.ps1 -InnoCompilerPath $env:ISCC

      - name: 发布到 Release
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:TAG
          $version = $tag -replace '^\D+', ''
          $installer = "artifacts\installer\DropShelf-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "标签 $tag 与安装包版本号不一致，请先修改版本号。" }
          $portable = "artifacts\DropShelf-$version-portable.zip"
          Compress-Archive -LiteralPath "artifacts\win-x64\DropShelf.exe" -DestinationPath $portable -Force

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $installer $portable --clobber
          } else {
              gh release create $tag $installer $portable --title "DropShelf $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "无法发布到 Release。" }
