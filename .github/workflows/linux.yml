# 改动 Linux 平台层或共享代码时，在 Arch 容器里编译并运行 Linux 侧的测试。
# 测试不需要窗口系统；构建机没有 Wayland 合成器时，涉及窗口的测试会自己跳过。
name: Linux

on:
  push:
    # tag 只走 Release 工作流，发布入口保持一条路径。
    branches: ['**']
    paths:
      - 'native/**'
      - 'linux/**'
      - 'installer/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'linux/**'
      - 'installer/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: 安装依赖
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake ninja pkgconf \
            gtk4 gtk4-layer-shell gdk-pixbuf2 curl glib2 libarchive fontconfig \
            file desktop-file-utils librsvg patchelf zsync appstream

      - uses: actions/checkout@v5

      - name: 编译并运行测试
        run: |
          cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/build
          ctest --test-dir linux/build --output-on-failure

      - name: 打包便携版和安装包
        run: |
          ./linux/package.sh "$GITHUB_WORKSPACE/dist"
          ./linux/package-formats.sh linux/build "$GITHUB_WORKSPACE/dist"
          ls -lh dist

      - name: 上传构建结果
        uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error