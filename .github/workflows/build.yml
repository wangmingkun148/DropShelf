# 改动 C 版（native 目录）或安装脚本时，编译并运行 C 版的测试。
# 测试会打开窗口、用剪贴板，设置和日志写到临时文件夹；构建机的屏幕较小时，个别需要大窗口的检查会跳过。
name: Build

on:
  push:
    paths:
      - 'native/**'
      - 'installer/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'installer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: 编译并运行测试
        shell: pwsh
        run: .\native\build.ps1
